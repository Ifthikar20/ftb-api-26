name: Deploy july-feature to 18.208.3.3

# Option A push-to-deploy: every push to the july-feature branch ships that
# branch straight to the 18.208.3.3 host and runs migrations there.
#
# IMPORTANT: 18.208.3.3 is the Elastic IP of the "cansee-prod" instance. It is
# being used here as a shared test/staging target, but it is the same box that
# serves the public site, so treat every push to july-feature as going live on
# that host (migrations included, and there is no automatic rollback).
#
# Required repository secret (Settings > Secrets and variables > Actions):
#   EC2_SSH_KEY - the full body of fynda-deploy.pem (the key pair the
#                 18.208.3.3 instance was launched with). NOT cansee-deploy.

on:
  push:
    branches: [july-feature]
  workflow_dispatch: {}

# Never run two deploys against the box at once; let an in-flight one finish.
concurrency:
  group: deploy-july-feature-18-208-3-3
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy july-feature
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout july-feature
        uses: actions/checkout@v4
        with:
          ref: july-feature

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [[ -z "$EC2_SSH_KEY" ]]; then
            echo "::error::Missing EC2_SSH_KEY secret (the fynda-deploy.pem body). Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -H 18.208.3.3 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run deploy.sh against 18.208.3.3
        env:
          BRANCH: july-feature
          EC2_HOST: 18.208.3.3
          EC2_USER: ubuntu
          PEM_KEY: /home/runner/.ssh/deploy.pem
          REMOTE_DIR: /opt/cansee/ftb-api-26
          # --clean prunes stale Docker layers on the box before building so
          # the small root volume does not fill mid-deploy.
        run: bash scripts/deploy.sh deploy --clean

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://18.208.3.3/api/v1/version/ || echo "000")
            echo "attempt $i: HTTP $code"
            if [[ "$code" == "200" ]]; then exit 0; fi
            sleep 10
          done
          echo "::warning::Smoke test did not return 200 after retries (deploy may still have succeeded; the site is HTTP-only until 443/TLS is fixed)."
