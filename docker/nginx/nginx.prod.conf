worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream django {
        server web:8000;
    }

    # ── Redirect HTTP → HTTPS ──
    server {
        listen 80;
        server_name fetchbot.ai www.fetchbot.ai;
        return 301 https://$host$request_uri;
    }

    # ── Allow health checks over HTTP (internal) ──
    server {
        listen 80;
        server_name 100.31.135.211 localhost;

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host fetchbot.ai;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        location / {
            return 301 https://fetchbot.ai$request_uri;
        }
    }

    # ── HTTPS Server ──
    server {
        listen 443 ssl;
        server_name fetchbot.ai www.fetchbot.ai;

        ssl_certificate     /etc/nginx/ssl/fetchbot.ai.pem;
        ssl_certificate_key /etc/nginx/ssl/fetchbot.ai.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        # ── Error and maintenance pages ──
        # 502/504 are generated by nginx itself when the Django upstream is
        # down or timing out, so this needs no proxy_intercept_errors —
        # and deliberately does not intercept: errors Django *returns*
        # (DRF's JSON 4xx/5xx) pass through untouched for the SPA.
        # 503 is reserved for the maintenance switch below.
        error_page 502 504 /__errors/50x.html;
        error_page 503 /__errors/maintenance.html;

        location ^~ /__errors/ {
            internal;
            alias /etc/nginx/errors/;
            # This location declares add_header, so the server-level
            # headers (including the CSP) do not inherit here. That is
            # intentional: the pages carry inline CSS/JS by design —
            # they must render when nothing else in the stack works.
            add_header Retry-After 120 always;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # ── Maintenance switch ──
        # Flip on:  docker compose -f docker/docker-compose.prod.yml exec nginx touch /etc/nginx/maintenance.on
        # Flip off: docker compose -f docker/docker-compose.prod.yml exec nginx rm /etc/nginx/maintenance.on
        # The flag lives in the container filesystem, so recreating the
        # container clears it — a fresh deploy can never come up stuck in
        # maintenance. /health/, /static/ and the pixel JS stay exempt:
        # health so you can verify Django is up before lifting the flag,
        # the pixel so customer sites' script tags keep resolving.

        # ── Gzip Compression ──
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 4;
        gzip_types
            text/plain
            text/css
            text/javascript
            application/javascript
            application/json
            application/xml
            image/svg+xml;

        # ── Security Headers ──
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # CSP for content nginx serves directly (SPA document, static).
        # Django responses already get this from SecurityHeadersMiddleware;
        # mirroring it here closes the gap for the served SPA HTML.
        # frame-ancestors is header-only (a <meta> CSP ignores it), which
        # is why this belongs at the edge, not in index.html — and index.html
        # can't carry it without breaking Vite dev.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;

        # ── Django Static Files ──
        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── Health Check ──
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # ── Django Admin ──
        location /admin/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ── API Proxy ──
        location /api/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Forward the country resolved at the edge so the pixel-ingest
            # endpoint can read it without an external geo lookup. Cloudflare
            # sets CF-IPCountry; if you front this with the nginx geoip2
            # module instead, set $geoip2_country here and forward it as
            # X-Geo-Country. Empty when neither is present.
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ── WebSocket Proxy ──
        location /ws/ {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 86400;
        }

        # ── Pixel / Tracking JS (served to external websites) ──
        # /p.js is the v2 short-path served to all newly issued snippets.
        # /pixel/ is kept for existing installs of the legacy v1 script.
        location = /p.js {
            alias /etc/nginx/pixel/p.min.js;
            default_type application/javascript;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=300";
            access_log off;
        }
        location /pixel/ {
            alias /etc/nginx/pixel/;
            types { application/javascript js; }
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        # ── Vue SPA (catch-all — must be LAST) ──
        location / {
            if (-f /etc/nginx/maintenance.on) { return 503; }
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            # index.html must NEVER be cached — it references hashed asset URLs
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }

            # Hashed assets (JS, CSS, images) — cache forever
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
        }
    }
} # end http
