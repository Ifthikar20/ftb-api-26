<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>FetchBot is having trouble</title>
<style>
  /* Served by nginx when the application tier is unreachable (502/504).
     Everything is inline and system-font: when this page renders, no
     other part of the stack can be assumed to be working. */
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --ink: #16212e;
    --muted: #5b6b7d;
    --accent: #0e7c6b;
    --rule: #d9e0e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1420;
      --card: #16202e;
      --ink: #e6ecf3;
      --muted: #93a3b5;
      --accent: #3fbfa4;
      --rule: #26374a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    padding: 24px;
  }
  .card {
    max-width: 30rem;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 12px;
    padding: 44px 44px 36px;
    text-align: center;
  }
  .wordmark {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 30px;
  }
  .pulse {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0 0 28px;
  }
  .pulse span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: breathe 1.5s ease-in-out infinite;
  }
  .pulse span:nth-child(2) { animation-delay: 0.2s; }
  .pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes breathe {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pulse span { animation: none; opacity: 0.7; }
  }
  h1 {
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 10px;
  }
  p {
    margin: 0 0 8px;
    color: var(--muted);
    font-size: 15px;
  }
  .status {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main class="card" role="main">
    <p class="wordmark">FetchBot</p>
    <div class="pulse" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1>Something went wrong on our side</h1>
    <p>The service is not responding right now. Your data is safe, and nothing you did caused this.</p>
    <p>This page retries automatically and reloads the moment we are back.</p>
    <div class="status" id="status">Checking again shortly&hellip;</div>
  </main>
  <script>
    /* Poll the health endpoint; reload the app as soon as it answers.
       Interval is generous so a page full of waiting browsers does not
       become its own load problem. */
    (function () {
      var tries = 0;
      var el = document.getElementById("status");
      function check() {
        tries += 1;
        fetch("/health/", { cache: "no-store" })
          .then(function (r) {
            if (r.ok) { location.reload(); return; }
            schedule();
          })
          .catch(schedule);
      }
      function schedule() {
        el.textContent = "Still reconnecting (attempt " + tries + ")…";
        setTimeout(check, 20000);
      }
      setTimeout(check, 20000);
    })();
  </script>
</body>
</html>
